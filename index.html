<style>
:root{--bg:#0e2433;--bg2:#17445e;--panel:#16384d;--panel2:#1d4a64;--tile:#e9f5ee;--ink:#0e2433;--a:#ffc23c;--t:#3ddbc4;--bad:#ff6b6b;--txt:#e9f5ee;--mut:#8fb2c4;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2) 0%,var(--bg) 60%);color:var(--txt);font-family:'Cairo',system-ui,sans-serif;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.display{font-family:'Lalezar','Cairo',sans-serif;letter-spacing:.5px}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:12px 14px 24px;position:relative}
.screen{display:none;animation:in .25s ease}.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.bar .grow{flex:1;display:flex;justify-content:center;gap:6px}
.chip{background:var(--panel);border-radius:999px;padding:5px 12px;font-weight:700;display:inline-flex;gap:6px;align-items:center;font-size:14px;white-space:nowrap}
.chip b{color:var(--a)}
.ibtn{background:var(--panel);width:40px;height:40px;border-radius:50%;font-size:19px;display:grid;place-items:center;flex:0 0 auto}
.ibtn:active{background:var(--panel2)}.ibtn.off{opacity:.45}
.back{font-size:22px}[dir=rtl] .back{transform:scaleX(-1)}
.wheel,.wheel *{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.logo{text-align:center;margin:22px 0 26px}
.logo h1{font-size:56px;line-height:1;margin:0;color:var(--a)}
.logo p{margin:6px 0 0;color:var(--mut);font-size:15px}
.modes{display:grid;gap:14px}
.mode{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:22px;padding:22px 24px;text-align:start;border:2px solid transparent;transition:.15s}
.mode:active{transform:scale(.98);border-color:var(--a)}
.mode .big{font-size:46px;line-height:1;color:var(--t)}
.mode small{display:block;color:var(--mut);font-size:14px;margin-top:6px}
.mode .prog{font-size:26px;font-weight:900;color:var(--a);direction:ltr}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.tab{flex:0 0 auto;background:var(--panel);border-radius:14px;padding:8px 14px;font-weight:700;font-size:14px;border:2px solid transparent;white-space:nowrap}
.tab.on{border-color:var(--w);color:var(--w)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lv{border-radius:14px;background:var(--panel);font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px;padding:9px 10px;text-align:start;min-height:54px}
.lv span{font-size:12.5px;font-weight:700;line-height:1.25;flex:1}
.lv i{font-style:normal;font-weight:900;min-width:26px}
.lv small{display:block;font-size:10px;letter-spacing:1px;opacity:.85;font-weight:500}
.lv.done{background:var(--w);color:var(--ink)}
.lv.cur{outline:3px solid var(--a);animation:pulse 1.6s infinite}
.lv.lock{opacity:.35}
@keyframes pulse{50%{outline-offset:3px}}
.wname{text-align:center;margin:0;color:var(--w);font-size:28px}
.diff{text-align:center;margin:0 0 12px;color:var(--mut);font-size:14px}
.diff b{color:var(--w)}
.gridbox{display:flex;justify-content:center;margin:2px 0 8px}
.cw{display:grid;gap:3px;justify-content:center}
.cell{display:grid;place-items:center;border-radius:8px;background:rgba(255,255,255,.14);font-weight:900;color:var(--ink);line-height:1}
.cell.f{background:var(--tile)}.cell.h{background:var(--a)}
.cell.pop{animation:pop .45s ease backwards}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.25)}}
.cur-row{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;margin-bottom:6px}
.cur-word{min-height:44px;display:flex;justify-content:center;align-items:center;gap:4px;font-size:26px;font-weight:900}
.cur-word span{background:var(--a);color:var(--ink);border-radius:10px;min-width:34px;text-align:center;padding:0 4px}
.cur-word span.new{animation:pop .18s ease}
.cur-word.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bchip{position:absolute}
.stat{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.wheel{--wh:min(280px,78vw,38vh);position:relative;width:var(--wh);height:var(--wh);margin:0 auto 12px;border-radius:50%;background:var(--panel)}
.tile{position:absolute;left:50%;top:50%;width:calc(var(--wh)*var(--tw,.21));height:calc(var(--wh)*var(--tw,.21));margin:calc(var(--wh)*var(--tw,.21)*-.5) 0 0 calc(var(--wh)*var(--tw,.21)*-.5);border-radius:50%;background:var(--tile);color:var(--ink);font-size:calc(var(--wh)*var(--tw,.21)*.55);font-weight:900;display:grid;place-items:center;transition:left .35s ease,top .35s ease,transform .12s,background .12s;font-family:'Cairo',sans-serif}
.wheel.nt .tile{transition:none}
.tile.s{background:var(--a);transform:scale(1.12)}
.acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.act{background:var(--panel);border-radius:16px;padding:8px 14px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;min-width:84px;gap:2px}
.act i{font-style:normal;font-size:12px;color:var(--a)}
.act:active{background:var(--panel2)}
#modal{position:fixed;inset:0;background:rgba(5,15,22,.7);display:none;place-items:center;z-index:20;padding:20px}
#modal.on{display:grid}
.card{background:var(--panel);border-radius:26px;padding:28px 24px;text-align:center;max-width:340px;width:100%;animation:pop .4s ease}
.card h2{font-size:40px;margin:0;color:var(--a)}
.card p{color:var(--mut);margin:8px 0 14px}
.stars{font-size:46px;letter-spacing:6px;color:#4b6b80;margin:4px 0}
.stars span{display:inline-block}
.stars span.on{color:var(--a);animation:pop .5s ease backwards}
.card button{display:block;width:100%;padding:13px;border-radius:14px;font-weight:900;font-size:17px;margin-top:8px;background:var(--panel2)}
.card button.p{background:var(--a);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--panel2);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;z-index:30;pointer-events:none;text-align:center;max-width:90vw}

 function check(ch,y,x,d){
  const n=ch.length,dy=d,dx=1-d;
  if(occ.has(K(y-dy,x-dx))||occ.has(K(y+n*dy,x+n*dx)))return -1;

  click:t=>note(84,t,.05,'sine',.12),

function startLevel(i,o){

 if(!lv||!lv.words.length){toast('⚠');return}

function shuffle(){

  if(a.length<2||a.some((v,i)=>v!==order[i]))break}

}

}
function lineUpd(){const s=$('ln');if(!s||!G)return;const n=order.length;

  if(G.fw[k]){toast(t.dup);AU.play('lock');clear();return}
  clear();fillWord(k,true,1);return}

  if(G.bf.has(w)){toast(t.dup);AU.play('lock');clear();return}
  const v=G.replay?1:5;G.bf.add(w);S.coins+=v;G.earned+=v;S.stat.b++;save();coins();drawStat();toast(t.bon.replace('+5','+'+v));AU.play('bonus');clear();checkAch();return}

function win(){

 let bonus=0,last=false;
 if(g.weekly){const w=weekNum(),wk=S.wk[mode];wk.streak=wk.last===w-1?wk.streak+1:1;wk.last=w;bonus=150+25*Math.min(wk.streak,4);S.stat.d++}

let dragging=false,pid=null,raf=0,clr=0;
function pointerXY(e){const r=$('wheel').getBoundingClientRect();return[(e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100]}
function hitTile(cx,cy){
 const r=$('wheel').getBoundingClientRect();if(!r.width||!order.length)return -1;
 const x=(cx-r.left)/r.width*100,y=(cy-r.top)/r.height*100,n=order.length;
 let best=-1,bd=1e9;
 for(let p=0;p<n;p++){const[a,b]=tilePos(p,n);const d=Math.hypot(a-x,b-y);if(d<bd){bd=d;best=p}}

}
function endDrag(commit){

 const w=$('wheel');try{if(pid!==null&&w.hasPointerCapture(pid))w.releasePointerCapture(pid)}catch(e){}

 if(commit&&sel.length>1)submit();else clear();
}
(function(){
 const wheel=$('wheel');
 wheel.addEventListener('pointerdown',e=>{
  if(dragging||!G||G.done||(e.pointerType==='mouse'&&e.button!==0))return;
  const k=hitTile(e.clientX,e.clientY);if(k<0)return;
  e.preventDefault();clearTimeout(clr);
  dragging=true;pid=e.pointerId;
  try{wheel.setPointerCapture(pid)}catch(err){}
  sel=[k];ptr=pointerXY(e);AU.play('tile',0);drawWheel();drawCur();
 });
 wheel.addEventListener('pointermove',e=>{
  if(!dragging||e.pointerId!==pid)return;
  e.preventDefault();
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
  (evs.length?evs:[e]).forEach(ev=>{
   const k=hitTile(ev.clientX,ev.clientY);
   if(k>=0){
    if(!sel.includes(k)){sel.push(k);AU.play('tile',sel.length-1)}
    else if(sel.length>1&&sel[sel.length-2]===k){sel.pop();AU.play('tile',sel.length-1)}
   }
  });
  ptr=pointerXY(e);
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;drawWheel();drawCur()});

 wheel.addEventListener('contextmenu',e=>e.preventDefault());
})();

});

$('lback').onclick=()=>{AU.play('click');coins();show('menu')};
$('gback').onclick=()=>{AU.play('click');backToLevels()};
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){world=+b.dataset.w;AU.play('click');renderLevels()}};
$('grid').onclick=e=>{const b=e.target.closest('.lv');if(b)startLevel(+b.dataset.i)};

/* ---------- Fullscreen ---------- */
function isFS(){return document.fullscreenElement||document.webkitFullscreenElement}
function toggleFS(){
 const d=document,el=d.documentElement,msg=()=>toast(T[mode].fsno);
 try{
  if(isFS()){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
  else{const r=el.requestFullscreen||el.webkitRequestFullscreen;if(!r){msg();return}
   const p=r.call(el);if(p&&p.catch)p.catch(msg)}
 }catch(e){msg()}
}
document.querySelectorAll('.fs').forEach(b=>b.onclick=toggleFS);
const fsSync=()=>document.querySelectorAll('.fs').forEach(b=>b.textContent=isFS()?'✕':'⛶');
document.addEventListener('fullscreenchange',fsSync);document.addEventListener('webkitfullscreenchange',fsSync);

/* ---------- Daily / gifts / achievements / shop ---------- */
const dayNum=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
function startDaily(){const m=mode,d=dayNum();
 if(S.dc[m].last===d){AU.play('lock');toast(T[m].dailydone);return}
 const T0=TOTAL(m),lo=Math.floor(T0*.4),i=lo+((d*7+(m==='ar'?3:0))%(T0-lo));
 startLevel(i,{daily:true,seed:d,W:Math.min(16,cfg(i).W+1)})}
$('dbtn').onclick=startDaily;
const ACH=[
 {id:'a1',r:10,en:'First word',ar:'أول كلمة',f:()=>S.stat.w>=1},
 {id:'a2',r:30,en:'Word hunter · 100 words',ar:'صياد الكلمات · 100 كلمة',f:()=>S.stat.w>=100},
 {id:'a3',r:30,en:'Bonus finder · 25 bonus words',ar:'باحث الكنوز · 25 كلمة إضافية',f:()=>S.stat.b>=25},
 {id:'a4',r:30,en:'10 levels completed',ar:'إنهاء 10 مراحل',f:()=>S.stat.l>=10},
 {id:'a5',r:80,en:'50 levels completed',ar:'إنهاء 50 مرحلة',f:()=>S.stat.l>=50},
 {id:'a6',r:60,en:'Perfectionist · 10 levels with 3 stars',ar:'المتقن · 10 مراحل بثلاث نجوم',f:()=>S.stat.p>=10},
 {id:'a7',r:50,en:'Daily player · 3 daily challenges',ar:'لاعب يومي · 3 تحديات',f:()=>S.stat.d>=3},
 {id:'a8',r:20,en:'Rich · 500 coins',ar:'ثري · 500 عملة',f:()=>S.coins>=500},
 {id:'a9',r:40,en:'Bilingual · play both languages',ar:'ثنائي اللغة · مرحلة بكل لغة',f:()=>S.prog.ar>=1&&S.prog.en>=1},
 {id:'a10',r:50,en:'Collector · own 3 themes',ar:'جامع · امتلك 3 ثيمات',f:()=>S.themes.length>=3}
];
function checkAch(){let any=false;
 ACH.forEach(a=>{if(!S.ach[a.id]&&a.f()){S.ach[a.id]=1;S.coins+=a.r;any=true;toast(`🏆 ${mode==='ar'?a.ar:a.en} · +${a.r}`);AU.play('star',2)}});
 if(any){save();coins()}}
function renderAch(){coins();$('achlist').innerHTML=ACH.map(a=>{const d=!!S.ach[a.id];
 return `<div class="item ${d?'done':''}"><div>${a.ar}<small>${a.en}</small></div><span>${d?'✓':'🪙 '+a.r}</span></div>`}).join('')}
function renderShop(){coins();$('shoplist').innerHTML=THEMES.map(h=>{const own=S.themes.includes(h.id),on=S.theme===h.id;
 return `<div class="item ${on?'done':''}"><div>${h.n}<div class="sw">${['--bg2','--tile','--a','--t'].map(k=>`<i style="background:${h.v[k]}"></i>`).join('')}</div></div><button class="ibuy ${on?'on':own?'own':''}" data-id="${h.id}">${on?'✓':own?'استخدام · Use':'🪙 '+h.p}</button></div>`}).join('')}
$('shoplist').onclick=e=>{const b=e.target.closest('.ibuy');if(!b)return;const h=THEMES.find(x=>x.id===b.dataset.id);if(!h)return;
 if(!S.themes.includes(h.id)){if(S.coins<h.p){AU.play('lock');toast('العملات لا تكفي · Not enough coins');return}S.coins-=h.p;S.themes.push(h.id);AU.play('coin')}
 S.theme=h.id;applyTheme(h.id);save();renderShop();checkAch();AU.play('click')};
$('mach').onclick=()=>{AU.play('click');renderAch();show('ach')};
$('mshop').onclick=()=>{AU.play('click');renderShop();show('shop')};
document.querySelectorAll('.back[data-to]').forEach(b=>b.onclick=()=>{AU.play('click');coins();show(b.dataset.to)});
function giftCheck(){
 const d=dayNum();if(S.gift.last===d||!$('menu').classList.contains('on'))return;
 const streak=S.gift.last===d-1?S.gift.streak+1:1,amt=20+10*Math.min(streak-1,6);
 $('card').dir='ltr';
 $('card').innerHTML=`<h2 class="display">🎁 هدية اليوم</h2><p>Daily gift · 🔥 ${streak}</p><div class="stars" style="color:var(--a)">+${amt} 🪙</div><button class="p" id="gclaim">استلام · Claim</button>`;
 $('modal').classList.add('on');
 $('gclaim').onclick=()=>{S.gift={last:d,streak};S.coins+=amt;save();coins();AU.unlock();AU.play('coin');$('modal').classList.remove('on');checkAch()};
}
const weekNum=()=>Math.floor((dayNum()+3)/7);
function startWeekly(){const m=mode,w=weekNum();
 if(S.wk[m].last===w){AU.play('lock');toast(m==='ar'?'أنجزته هالأسبوع · ارجع الأسبوع الجاي':'Done this week · come back next week');return}
 const T0=TOTAL(m),lo=Math.floor(T0*.6),i=lo+((w*11+(m==='ar'?5:0))%(T0-lo));
 startLevel(i,{weekly:true,seed:w+1000,W:14})}
$('wbtn').onclick=startWeekly;
$('bchip').onclick=()=>{if(!G||G.done)return;const t=mode==='ar'?{h:'الكلمات الإضافية',n:'ما لقيت كلمات إضافية بعد',c:'إغلاق'}:{h:'Bonus words',n:'No bonus words yet',c:'Close'};
 $('card').dir=mode==='ar'?'rtl':'ltr';
 $('card').innerHTML=`<h2 class='display'>⭐ ${t.h}</h2><p>${G.bf.size?[...G.bf].join(' · '):t.n}</p><button id='bwclose'>${t.c}</button>`;
 $('modal').classList.add('on');$('bwclose').onclick=()=>$('modal').classList.remove('on')};
function openBackup(){
 const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
 $('card').dir='ltr';
 $('card').innerHTML=`<h2 class='display'>💾 نسخ احتياطي</h2><p>Backup · انسخ الكود واحفظه، أو الصق كود قديم للاستعادة</p><textarea id='bkcode' rows='5' style='width:100%;border-radius:12px;border:0;padding:8px;font-size:11px;direction:ltr;background:var(--tile);color:var(--ink)'>${code}</textarea><button class='p' id='bkcopy'>نسخ · Copy</button><button id='bkrest'>استعادة من الكود · Restore</button><button id='bkclose'>إغلاق · Close</button>`;
 $('modal').classList.add('on');
 const ta=$('bkcode');
 $('bkcopy').onclick=()=>{ta.value=code;ta.select();try{navigator.clipboard.writeText(code).then(()=>toast('✓ تم النسخ · Copied')).catch(()=>{document.execCommand('copy');toast('✓ Copied')})}catch(e){try{document.execCommand('copy');toast('✓ Copied')}catch(e2){toast('انسخ يدويا · Copy manually')}}};
 $('bkrest').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))));if(!o||typeof o!=='object'||o.coins===undefined)throw 0;
  S.st={ar:{},en:{}};S.ach={};S.themes=['0'];S.theme='0';applyState(o);applyTheme(S.theme);save();coins();sndUI();AU.vol();$('modal').classList.remove('on');toast('✓ تمت الاستعادة · Restored')}catch(e){toast('كود غير صحيح · Invalid code')}};
 $('bkclose').onclick=()=>$('modal').classList.remove('on');
}
$('mbak').onclick=()=>{AU.play('click');openBackup()};
setTimeout(giftCheck,500);
sndUI();coins();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})</script>
</body>
</html>
